<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emmet</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #050505;
    color: white;
    font-family: Arial, sans-serif;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 30px;
}

#emmet {
    width: 330px;
    height: 330px;
    border-radius: 50%;

    background: #020202;
    border: 4px solid #111;

    box-shadow:
        0 0 20px #00ffff55,
        inset 0 0 30px #00ffff11;

    display: flex;
    align-items: center;
    justify-content: center;
    gap: 65px;

    transition: 0.3s;
}

.eye {
    width: 55px;
    height: 100px;
    border-radius: 50%;

    background: #00ffff;

    box-shadow:
        0 0 15px #00ffff,
        0 0 35px #00ffff;

    transition: 0.2s;
}

.eye.blink {
    height: 8px;
}

#emmet.listening {
    box-shadow:
        0 0 25px #00ffff,
        0 0 70px #00ffff;
}

#emmet.thinking {
    box-shadow:
        0 0 25px #a000ff,
        0 0 70px #a000ff;
}

#emmet.talking {
    transform: scale(1.03);
}

button {
    padding: 15px 30px;

    border: none;
    border-radius: 12px;

    background: #00ffff;
    color: black;

    font-size: 18px;
    font-weight: bold;

    cursor: pointer;
}

button:hover {
    transform: scale(1.05);
}

button:disabled {
    opacity: 0.6;
    cursor: default;
}

#status {
    font-size: 16px;
    opacity: 0.8;
    min-height: 24px;
    text-align: center;
}
</style>
</head>

<body>

<div id="emmet">

    <div class="eye" id="leftEye"></div>
    <div class="eye" id="rightEye"></div>

</div>

<button id="activate">
    ACTIVAR EMMET
</button>

<div id="status">
    Pulsa el botón para empezar.
</div>

<script>

const emmet = document.getElementById("emmet");
const activateButton = document.getElementById("activate");
const statusText = document.getElementById("status");

let recognition = null;
let active = false;
let speaking = false;


/* =========================
   HABLAR
========================= */

function speak(text) {

    if (!text) return;

    speechSynthesis.cancel();

    const utterance =
        new SpeechSynthesisUtterance(text);

    utterance.lang = "es-ES";
    utterance.rate = 1.05;
    utterance.pitch = 1.15;

    utterance.onstart = () => {

        speaking = true;

        emmet.classList.remove("listening");
        emmet.classList.add("talking");

        statusText.textContent =
            "Emmet está hablando...";

    };

    utterance.onend = () => {

        speaking = false;

        emmet.classList.remove("talking");

        if (active) {

            statusText.textContent =
                "Escuchando...";

            setTimeout(() => {
                startListening();
            }, 300);
        }

    };

    speechSynthesis.speak(utterance);
}


/* =========================
   GEMINI
========================= */

function buscarEnGemini(texto) {

    let consulta = texto
        .replace(/buscar en gemini/gi, "")
        .replace(/busca en gemini/gi, "")
        .replace(/buscar en google/gi, "")
        .replace(/busca en google/gi, "")
        .trim();

    if (!consulta) {

        speak(
            "¿Qué quieres que busque en Gemini?"
        );

        return;
    }

    speak(
        "Voy a buscarlo en Gemini."
    );

    const url =
        "https://gemini.google.com/app?q=" +
        encodeURIComponent(consulta);

    window.open(url, "_blank");
}


/* =========================
   PROCESAR LO QUE DICES
========================= */

async function procesarTexto(text) {

    const texto = text.toLowerCase().trim();

    console.log("Usuario:", text);


    /* GEMINI */

    if (
        texto.includes("buscar en gemini") ||
        texto.includes("busca en gemini")
    ) {

        buscarEnGemini(text);

        return;
    }


    /* GOOGLE ANTIGUO */

    if (
        texto.includes("buscar en google") ||
        texto.includes("busca en google")
    ) {

        let consulta = text
            .replace(/buscar en google/gi, "")
            .replace(/busca en google/gi, "")
            .trim();

        if (!consulta) {

            speak(
                "¿Qué quieres que busque?"
            );

            return;
        }

        speak(
            "Voy a buscarlo en Google."
        );

        window.open(
            "https://www.google.com/search?q=" +
            encodeURIComponent(consulta),
            "_blank"
        );

        return;
    }


    /* RESPUESTAS BÁSICAS */

    if (
        texto === "hola" ||
        texto === "hola emmet" ||
        texto.includes("buenas")
    ) {

        speak(
            "¡Hola! Soy Emmet. ¿Qué hacemos?"
        );

        return;
    }


    if (
        texto.includes("cómo te llamas") ||
        texto.includes("como te llamas") ||
        texto.includes("tu nombre")
    ) {

        speak(
            "Me llamo Emmet."
        );

        return;
    }


    if (
        texto.includes("qué puedes hacer") ||
        texto.includes("que puedes hacer")
    ) {

        speak(
            "Puedo escucharte, hablar contigo y abrir Gemini para buscar información."
        );

        return;
    }


    if (texto.includes("gracias")) {

        speak(
            "¡De nada!"
        );

        return;
    }


    if (
        texto === "adiós" ||
        texto === "adios"
    ) {

        speak(
            "Hasta luego."
        );

        return;
    }


    /*
       RESPUESTA TEMPORAL

       Aquí NO fingimos que Emmet tiene
       una IA completa todavía.
    */

    speak(
        "He entendido lo que has dicho. Si quieres información sobre eso, puedes decir: busca en Gemini, seguido de tu pregunta."
    );
}


/* =========================
   RECONOCIMIENTO DE VOZ
========================= */

function createRecognition() {

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if (!SpeechRecognition) {

        statusText.textContent =
            "Este navegador no permite reconocimiento de voz.";

        speak(
            "Este navegador no permite reconocimiento de voz."
        );

        return null;
    }

    const r = new SpeechRecognition();

    r.lang = "es-ES";
    r.continuous = false;
    r.interimResults = false;
    r.maxAlternatives = 1;


    r.onstart = () => {

        if (!speaking) {

            emmet.classList.add("listening");

            statusText.textContent =
                "Escuchando...";

        }
    };


    r.onresult = async (event) => {

        const text =
            event.results[0][0].transcript.trim();

        emmet.classList.remove("listening");

        statusText.textContent =
            "Has dicho: " + text;

        await procesarTexto(text);
    };


    r.onerror = (event) => {

        console.log(
            "Error de reconocimiento:",
            event.error
        );

        emmet.classList.remove("listening");

        if (
            active &&
            !speaking
        ) {

            statusText.textContent =
                "No te he entendido.";

            setTimeout(() => {

                startListening();

            }, 1000);
        }
    };


    r.onend = () => {

        emmet.classList.remove("listening");

    };


    return r;
}


/* =========================
   EMPEZAR A ESCUCHAR
========================= */

function startListening() {

    if (!active) return;

    if (speaking) return;

    if (!recognition) {

        recognition =
            createRecognition();
    }

    if (!recognition) return;

    try {

        recognition.start();

    } catch (error) {

        console.log(
            "No se pudo iniciar el micrófono:",
            error
        );
    }
}


/* =========================
   ACTIVAR EMMET
========================= */

activateButton.addEventListener(
    "click",
    () => {

        active = true;

        activateButton.textContent =
            "EMMET ACTIVADO";

        activateButton.disabled = true;

        statusText.textContent =
            "Iniciando Emmet...";

        speak(
            "Hola. Soy Emmet. Ya estoy listo."
        );
    }
);


/* =========================
   PARPADEO
========================= */

function blink() {

    const leftEye =
        document.getElementById("leftEye");

    const rightEye =
        document.getElementById("rightEye");

    leftEye.classList.add("blink");
    rightEye.classList.add("blink");

    setTimeout(() => {

        leftEye.classList.remove("blink");
        rightEye.classList.remove("blink");

    }, 150);
}

setInterval(
    blink,
    3500
);

</script>

</body>
</html>

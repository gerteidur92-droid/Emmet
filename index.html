<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Emmet</title>

<!-- MAPA -->
<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    min-height: 100vh;

    background: #050505;

    color: white;

    font-family: Arial, sans-serif;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    gap: 20px;

}


/* =========================
   EMMET
========================= */

#emmet {

    width: 330px;

    height: 330px;

    border-radius: 50%;

    background: #000;

    border: 3px solid #151515;

    box-shadow:
        0 0 35px rgba(0,220,255,.15);

    display: flex;

    justify-content: center;

    align-items: center;

    gap: 65px;

    transition: .3s;

}


.eye {

    width: 58px;

    height: 100px;

    border-radius: 50%;

    background: #00eaff;

    box-shadow:
        0 0 25px #00eaff;

    transition: .2s;

}


.blink {

    height: 8px;

}


.thinking {

    box-shadow:
        0 0 45px #9b00ff;

}


.thinking .eye {

    background: #9b00ff;

    box-shadow:
        0 0 30px #9b00ff;

}


.silent {

    opacity: .35;

}


#status {

    font-size: 16px;

    color: #aaa;

    text-align: center;

    min-height: 22px;

}


button {

    border: none;

    border-radius: 30px;

    padding: 15px 25px;

    background: #00eaff;

    color: #000;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

}


/* =========================
   MAPA
========================= */

#mapa {

    display: none;

    position: fixed;

    top: 5vh;

    left: 5vw;

    width: 90vw;

    height: 90vh;

    background: #111;

    border-radius: 20px;

    overflow: hidden;

    z-index: 1000;

    border: 2px solid #00eaff;

    box-shadow:
        0 0 40px rgba(0,234,255,.35);

}


#map {

    width: 100%;

    height: 100%;

}


#cerrarMapa {

    position: absolute;

    z-index: 2000;

    top: 15px;

    right: 15px;

    padding: 10px 18px;

    background: #111;

    color: white;

    border: 2px solid #00eaff;

    border-radius: 20px;

    cursor: pointer;

}


#mapaTitulo {

    position: absolute;

    z-index: 2000;

    top: 15px;

    left: 15px;

    padding: 10px 18px;

    background: rgba(0,0,0,.75);

    color: white;

    border-radius: 20px;

}

</style>

</head>


<body>


<!-- =========================
     EMMET
========================= -->

<div id="emmet">

    <div class="eye"></div>

    <div class="eye"></div>

</div>


<div id="status">
    Emmet está apagado
</div>


<button id="activar">
    ACTIVAR EMMET
</button>



<!-- =========================
     MAPA
========================= -->

<div id="mapa">

    <div id="mapaTitulo">
        📍 Emmet Maps
    </div>

    <button id="cerrarMapa">
        ✕ Cerrar
    </button>

    <div id="map"></div>

</div>



<!-- LEAFLET -->

<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>



<script>


// =====================================================
// VARIABLES
// =====================================================

const emmet =
    document.getElementById("emmet");

const statusText =
    document.getElementById("status");

const boton =
    document.getElementById("activar");

const mapaVentana =
    document.getElementById("mapa");

const botonCerrarMapa =
    document.getElementById("cerrarMapa");


let activo = false;

let modoNinja = false;

let hablando = false;

let pensando = false;

let recognition = null;

let mapa = null;

let marcador = null;

let ultimoSonido = Date.now();

const TIEMPO_SIN_SONIDO = 8000;


// =====================================================
// DATOS ASTRONOMÍA
// =====================================================

const datosAstronomia = [

    "Un dato curioso de la astronomía es que un día en Venus dura más que un año en Venus.",

    "Un dato curioso de la astronomía es que Júpiter es tan grande que cabrían más de mil Tierras dentro de él.",

    "Un dato curioso de la astronomía es que la luz del Sol tarda unos ocho minutos en llegar hasta la Tierra.",

    "Un dato curioso de la astronomía es que Saturno tiene una densidad media menor que la del agua.",

    "Un dato curioso de la astronomía es que Olympus Mons, en Marte, es uno de los volcanes más grandes conocidos del Sistema Solar.",

    "Un dato curioso de la astronomía es que la Vía Láctea y Andrómeda se están acercando entre sí.",

    "Un dato curioso de la astronomía es que algunas estrellas que vemos podrían haber cambiado hace mucho tiempo, pero su luz todavía está viajando hacia nosotros.",

    "Un dato curioso de la astronomía es que las estrellas de neutrones son objetos extremadamente densos.",

    "Un dato curioso de la astronomía es que algunos agujeros negros tienen millones o incluso miles de millones de veces la masa del Sol.",

    "Un dato curioso de la astronomía es que Neptuno tarda aproximadamente 165 años terrestres en dar una vuelta alrededor del Sol."

];


// =====================================================
// HABLAR
// =====================================================

function hablar(texto) {

    if (modoNinja) return;


    hablando = true;

    pensando = false;

    ultimoSonido = Date.now();


    emmet.classList.remove("listening");

    emmet.classList.add("thinking");


    statusText.textContent =
        "Emmet está hablando...";


    speechSynthesis.cancel();


    const voz =
        new SpeechSynthesisUtterance(texto);


    voz.lang = "es-ES";

    voz.rate = 1.05;

    voz.pitch = 1.15;

    voz.volume = 1;


    voz.onend = () => {

        hablando = false;

        pensando = false;

        emmet.classList.remove("thinking");


        if (!modoNinja) {

            statusText.textContent =
                "Escuchando...";


            // Los 8 segundos empiezan
            // DESPUÉS de terminar de hablar.

            ultimoSonido =
                Date.now();

        }

    };


    voz.onerror = () => {

        hablando = false;

        pensando = false;

        ultimoSonido =
            Date.now();

        emmet.classList.remove("thinking");

    };


    speechSynthesis.speak(voz);

}


// =====================================================
// PARPADEO
// =====================================================

setInterval(() => {

    if (!activo) return;


    const ojos =
        document.querySelectorAll(".eye");


    ojos.forEach(ojo => {

        ojo.classList.add("blink");

    });


    setTimeout(() => {

        ojos.forEach(ojo => {

            ojo.classList.remove("blink");

        });

    },150);


},3500);


// =====================================================
// GROQ
// =====================================================

async function preguntarGroq(pregunta) {

    if (modoNinja) return;


    pensando = true;

    ultimoSonido =
        Date.now();


    emmet.classList.remove("listening");

    emmet.classList.add("thinking");


    statusText.textContent =
        "Emmet está pensando...";


    try {

        const respuesta =
            await fetch(
                "/api/groq",
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body: JSON.stringify({

                        pregunta:
                            pregunta

                    })

                }
            );


        const datos =
            await respuesta.json();


        if (!respuesta.ok) {

            console.error(datos);

            pensando = false;

            hablar(
                "Ha ocurrido un error al conectarme con mi inteligencia artificial."
            );

            return;

        }


        if (!datos.respuesta) {

            pensando = false;

            hablar(
                "No he recibido ninguna respuesta."
            );

            return;

        }


        pensando = false;

        hablar(
            datos.respuesta
        );


    } catch (error) {

        console.error(error);

        pensando = false;

        hablar(
            "No puedo conectarme con mi servidor ahora mismo."
        );

    }

}


// =====================================================
// MAPS
// =====================================================

function abrirMaps() {

    if (modoNinja) return;


    mapaVentana.style.display =
        "block";


    statusText.textContent =
        "Abriendo Maps...";


    if (!mapa) {

        mapa =
            L.map("map")
            .setView(
                [40.4168,-3.7038],
                13
            );


        L.tileLayer(
            "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
            {

                maxZoom: 19,

                attribution:
                    '&copy; OpenStreetMap contributors'

            }
        ).addTo(mapa);

    }


    // Pedir ubicación al navegador.

    if (
        navigator.geolocation
    ) {

        navigator.geolocation.getCurrentPosition(

            posicion => {

                const lat =
                    posicion.coords.latitude;

                const lon =
                    posicion.coords.longitude;


                mapa.setView(
                    [lat,lon],
                    16
                );


                if (marcador) {

                    marcador
                        .setLatLng(
                            [lat,lon]
                        );

                } else {

                    marcador =
                        L.marker(
                            [lat,lon]
                        )
                        .addTo(mapa);

                }


                marcador.bindPopup(
                    "📍 Estás aquí"
                );


                marcador.openPopup();


                statusText.textContent =
                    "Ubicación encontrada.";

            },


            error => {

                console.log(error);


                statusText.textContent =
                    "No se pudo obtener tu ubicación.";

                hablar(
                    "No puedo obtener tu ubicación. Comprueba que has permitido el acceso a la ubicación."
                );

            }

        );

    }


    setTimeout(() => {

        mapa.invalidateSize();

    },300);

}


// =====================================================
// CERRAR MAPS
// =====================================================

function cerrarMaps() {

    mapaVentana.style.display =
        "none";


    statusText.textContent =
        "Escuchando...";


    ultimoSonido =
        Date.now();

}


// =====================================================
// PROCESAR LO QUE DICE EL USUARIO
// =====================================================

function procesarTexto(texto) {

    texto =
        texto
        .toLowerCase()
        .trim();


    console.log(
        "Usuario:",
        texto
    );


    // ================================================
    // MODO NINJA
    // ================================================

    if (
        texto.includes("modo ninja") ||
        texto.includes("modo silencioso") ||
        texto.includes("silencio emmet")
    ) {

        if (!modoNinja) {

            modoNinja = true;

            speechSynthesis.cancel();

            hablando = false;

            pensando = false;

            emmet.classList.remove(
                "thinking"
            );

            emmet.classList.add(
                "silent"
            );

            statusText.textContent =
                "🥷 Modo ninja";

        } else {

            modoNinja = false;

            emmet.classList.remove(
                "silent"
            );

            ultimoSonido =
                Date.now();

            hablar(
                "Modo ninja desactivado."
            );

        }

        return;

    }


    // ================================================
    // MODO NINJA
    // ================================================

    if (modoNinja) return;


    // ================================================
    // MAPS
    // ================================================

    if (
        texto === "maps" ||
        texto === "map" ||
        texto.includes("abre maps") ||
        texto.includes("abrir maps") ||
        texto.includes("abre el mapa") ||
        texto.includes("abrir el mapa") ||
        texto.includes("enséñame el mapa") ||
        texto.includes("ensename el mapa")
    ) {

        abrirMaps();

        return;

    }


    // ================================================
    // CERRAR MAPS
    // ================================================

    if (
        texto.includes("cierra maps") ||
        texto.includes("cerrar maps") ||
        texto.includes("cierra el mapa") ||
        texto.includes("cerrar el mapa")
    ) {

        cerrarMaps();

        return;

    }


    // ================================================
    // EMMET SALUDA
    // ================================================

    if (
        texto.includes("emmet saluda") ||
        texto.includes("emmet, saluda") ||
        texto.includes("emmet saluda")
    ) {

        hablar(
            "¡Hola!"
        );

        return;

    }


    // ================================================
    // HOLA
    // ================================================

    if (
        texto === "hola" ||
        texto.includes("hola emmet") ||
        texto.includes("buenas")
    ) {

        hablar(
            "¡Hola! Soy Emmet."
        );

        return;

    }


    // ================================================
    // NOMBRE
    // ================================================

    if (
        texto.includes("cómo te llamas") ||
        texto.includes("como te llamas") ||
        texto.includes("cuál es tu nombre") ||
        texto.includes("cual es tu nombre")
    ) {

        hablar(
            "Me llamo Emmet."
        );

        return;

    }


    // ================================================
    // GRACIAS
    // ================================================

    if (
        texto.includes("gracias")
    ) {

        hablar(
            "¡De nada!"
        );

        return;

    }


    // ================================================
    // ADIÓS
    // ================================================

    if (
        texto.includes("adiós") ||
        texto.includes("adios")
    ) {

        hablar(
            "Hasta luego."
        );

        return;

    }


    // ================================================
    // TODO LO DEMÁS → GROQ
    // ================================================

    preguntarGroq(
        texto
    );

}


// =====================================================
// RECONOCIMIENTO DE VOZ
// =====================================================

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


if (SpeechRecognition) {

    recognition =
        new SpeechRecognition();


    recognition.lang =
        "es-ES";


    recognition.continuous =
        true;


    recognition.interimResults =
        false;


    recognition.onstart = () => {

        if (!modoNinja) {

            emmet.classList.add(
                "listening"
            );

            statusText.textContent =
                "Escuchando...";

        }

    };


    recognition.onresult =
        event => {

            const resultado =
                event.results[
                    event.results.length - 1
                ];


            const texto =
                resultado[0]
                .transcript;


            ultimoSonido =
                Date.now();


            procesarTexto(
                texto
            );

        };


    recognition.onerror =
        event => {

            console.log(
                "Error de voz:",
                event.error
            );

        };


    recognition.onend =
        () => {

            if (!activo) return;


            setTimeout(() => {

                try {

                    recognition.start();

                } catch (e) {}

            },500);

        };

}


// =====================================================
// DETECTOR DE SONIDO
// =====================================================

let audioContext =
    null;

let analyser =
    null;

let microphone =
    null;

let datosAudio =
    null;


async function iniciarDetectorAudio() {

    try {

        const stream =
            await navigator
            .mediaDevices
            .getUserMedia({
                audio:true
            });


        audioContext =
            new AudioContext();


        analyser =
            audioContext
            .createAnalyser();


        microphone =
            audioContext
            .createMediaStreamSource(
                stream
            );


        microphone.connect(
            analyser
        );


        analyser.fftSize =
            512;


        datosAudio =
            new Uint8Array(
                analyser.fftSize
            );


        ultimoSonido =
            Date.now();


        detectarSonido();


    } catch(error) {

        console.log(error);

        statusText.textContent =
            "No se pudo activar el micrófono.";

    }

}


// =====================================================
// DETECTAR SILENCIO
// =====================================================

function detectarSonido() {

    if (!activo) return;


    if (!analyser) {

        requestAnimationFrame(
            detectarSonido
        );

        return;

    }


    analyser.getByteTimeDomainData(
        datosAudio
    );


    let suma = 0;


    for (
        let i = 0;
        i < datosAudio.length;
        i++
    ) {

        const valor =
            (datosAudio[i] - 128)
            / 128;


        suma +=
            valor * valor;

    }


    const volumen =
        Math.sqrt(
            suma /
            datosAudio.length
        );


    const HAY_SONIDO =
        volumen > 0.035;


    if (
        HAY_SONIDO &&
        !hablando &&
        !pensando
    ) {

        ultimoSonido =
            Date.now();

    }


    // Nada de datos mientras
    // Emmet habla o piensa.

    if (
        modoNinja ||
        hablando ||
        pensando
    ) {

        ultimoSonido =
            Date.now();

        requestAnimationFrame(
            detectarSonido
        );

        return;

    }


    const tiempoSinSonido =
        Date.now()
        - ultimoSonido;


    // EXACTAMENTE DESPUÉS DE 8 SEGUNDOS

    if (
        tiempoSinSonido >=
        TIEMPO_SIN_SONIDO
    ) {

        ultimoSonido =
            Date.now();


        const indice =
            Math.floor(
                Math.random() *
                datosAstronomia.length
            );


        hablar(
            datosAstronomia[indice]
        );

    }


    requestAnimationFrame(
        detectarSonido
    );

}


// =====================================================
// ACTIVAR EMMET
// =====================================================

boton.addEventListener(
    "click",
    async () => {

        if (activo) return;


        activo = true;


        boton.style.display =
            "none";


        statusText.textContent =
            "Activando Emmet...";


        await iniciarDetectorAudio();


        if (recognition) {

            try {

                recognition.start();

            } catch(error) {

                console.log(error);

            }

        } else {

            statusText.textContent =
                "Este navegador no permite reconocimiento de voz.";

            return;

        }


        hablar(
            "Hola. Soy Emmet. Ya estoy conectado."
        );

    }
);


// =====================================================
// BOTÓN CERRAR MAPA
// =====================================================

botonCerrarMapa.addEventListener(
    "click",
    cerrarMaps
);

</script>

</body>
</html>

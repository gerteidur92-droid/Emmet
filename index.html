<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Emmet</title>

<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
}

body {

    background: #050505;
    color: white;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    display: flex;
    justify-content: center;
    align-items: center;

    overflow: hidden;
}

#contenedor {

    text-align: center;
    width: 100%;
}

#emmet {

    width: 300px;
    height: 300px;

    margin: auto;

    background: #000;

    border: 3px solid #111;

    border-radius: 50%;

    box-shadow:
        0 0 30px rgba(0,255,255,0.12),
        inset 0 0 30px rgba(0,255,255,0.04);

    display: flex;

    justify-content: center;
    align-items: center;

    gap: 45px;

    transition: 0.25s;
}


/* =====================================================
   OJOS
===================================================== */

.ojo {

    width: 55px;
    height: 85px;

    background: #00ffff;

    /*
       ARRIBA PLANO
       ABAJO REDONDEADO
    */

    border-radius:
        0
        0
        50%
        50%;

    box-shadow:
        0 0 15px #00ffff,
        0 0 35px rgba(0,255,255,0.55);

    transition: 0.2s;
}


/* =====================================================
   ESTADO
===================================================== */

#estado {

    margin-top: 25px;

    color: #00ffff;

    font-size: 18px;

    min-height: 22px;
}


/* =====================================================
   BOTÓN
===================================================== */

button {

    margin-top: 20px;

    padding: 13px 22px;

    border: none;

    border-radius: 12px;

    background: #00ffff;

    color: #000;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;
}

button:active {

    transform: scale(0.96);

}


/* =====================================================
   ESCUCHANDO
===================================================== */

.escuchando .ojo {

    animation:
        escuchar
        1s
        infinite
        alternate;
}


/* =====================================================
   PENSANDO
===================================================== */

.pensando .ojo {

    background: #9b00ff;

    box-shadow:
        0 0 20px #9b00ff,
        0 0 40px rgba(155,0,255,0.7);
}


/* =====================================================
   HABLANDO
===================================================== */

.hablando .ojo {

    animation:
        hablar
        0.25s
        infinite
        alternate;
}


/* =====================================================
   MODO NINJA
===================================================== */

.ninja .ojo {

    opacity: 0.15;

    box-shadow: none;
}


/* =====================================================
   ANIMACIONES
===================================================== */

@keyframes escuchar {

    from {
        transform: scaleY(1);
    }

    to {
        transform: scaleY(0.72);
    }

}

@keyframes hablar {

    from {
        transform: scaleY(0.8);
    }

    to {
        transform: scaleY(1.08);
    }

}


/* =====================================================
   MAPA
===================================================== */

#mapa {

    position: fixed;

    inset: 0;

    background: #111;

    display: none;

    z-index: 1000;
}

#map {

    width: 100%;
    height: 100%;
}

#cerrarMapa {

    position: absolute;

    top: 15px;
    right: 15px;

    z-index: 1001;

    margin: 0;

    background: white;

    color: black;

    padding: 12px 16px;

    border-radius: 10px;
}

#tituloMapa {

    position: absolute;

    top: 15px;
    left: 15px;

    z-index: 1001;

    background:
        rgba(0,0,0,0.8);

    padding: 10px 15px;

    border-radius: 10px;

    color: white;
}


/* =====================================================
   MÓVIL
===================================================== */

@media (max-width: 500px) {

    #emmet {

        width: 250px;
        height: 250px;

        gap: 35px;
    }

    .ojo {

        width: 48px;
        height: 73px;
    }

}

</style>

</head>


<body>


<div id="contenedor">

    <div id="emmet">

        <div class="ojo"></div>

        <div class="ojo"></div>

    </div>


    <div id="estado">
        Emmet
    </div>


    <button id="activar">
        ACTIVAR EMMET
    </button>

</div>



<!-- =====================================================
     MAPA
===================================================== -->

<div id="mapa">

    <div id="tituloMapa">
        📍 Emmet Maps
    </div>

    <button id="cerrarMapa">
        ✕ Cerrar
    </button>

    <div id="map"></div>

</div>



<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>



<script>

/* =====================================================
   VARIABLES
===================================================== */

const estado =
    document.getElementById("estado");

const emmet =
    document.getElementById("emmet");

const boton =
    document.getElementById("activar");


let reconocimiento = null;

let emmetActivo = false;

let hablando = false;

let pensando = false;

let modoNinja = false;

let mapa = null;

let temporizadorSilencio = null;


/* =====================================================
   ESTADOS
===================================================== */

function estadoNormal() {

    emmet.className = "";

    estado.textContent =
        "Emmet";

}


function estadoEscuchando() {

    if (modoNinja)
        return;

    emmet.className =
        "escuchando";

    estado.textContent =
        "Escuchando";

}


function estadoPensando() {

    emmet.className =
        "pensando";

    estado.textContent =
        "Pensando...";

}


function estadoHablando() {

    emmet.className =
        "hablando";

    estado.textContent =
        "Hablando...";

}


/* =====================================================
   VOZ
===================================================== */

function obtenerVoz() {

    const voces =
        speechSynthesis.getVoices();

    if (!voces.length)
        return null;


    return (

        voces.find(
            v => v.lang === "es-ES"
        )

        ||

        voces.find(
            v => v.lang.startsWith("es")
        )

        ||

        voces[0]

    );

}


speechSynthesis.onvoiceschanged =
    () => {

        speechSynthesis
            .getVoices();

    };


function hablar(texto) {

    return new Promise(resolve => {

        if (!texto) {

            resolve();

            return;

        }


        hablando = true;

        estadoHablando();


        if (reconocimiento) {

            try {

                reconocimiento.abort();

            } catch(e) {}

        }


        speechSynthesis.cancel();


        const frase =
            new SpeechSynthesisUtterance(
                texto
            );


        /*
           VOZ MÁS AGUDA
        */

        frase.lang =
            "es-ES";

        frase.rate =
            1.10;

        frase.pitch =
            1.25;

        frase.volume =
            1;


        const voz =
            obtenerVoz();


        if (voz) {

            frase.voice =
                voz;

        }


        frase.onend =
            () => {

                hablando =
                    false;

                estadoNormal();


                if (
                    emmetActivo &&
                    !modoNinja
                ) {

                    iniciarEscucha();

                }


                iniciarTemporizadorSilencio();


                resolve();

            };


        frase.onerror =
            () => {

                hablando =
                    false;

                estadoNormal();


                if (
                    emmetActivo &&
                    !modoNinja
                ) {

                    iniciarEscucha();

                }


                resolve();

            };


        speechSynthesis.speak(
            frase
        );

    });

}


/* =====================================================
   RECONOCIMIENTO DE VOZ
===================================================== */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


if (SpeechRecognition) {

    reconocimiento =
        new SpeechRecognition();


    reconocimiento.lang =
        "es-ES";


    reconocimiento.continuous =
        false;


    reconocimiento.interimResults =
        false;


    reconocimiento.maxAlternatives =
        3;


    reconocimiento.onstart =
        () => {

            if (
                !hablando &&
                !pensando &&
                !modoNinja
            ) {

                estadoEscuchando();

            }

        };


    reconocimiento.onresult =
        async event => {

            detenerTemporizadorSilencio();


            const resultado =
                event.results[
                    event.results.length - 1
                ];


            const texto =
                resultado[0]
                    .transcript
                    .trim();


            if (!texto) {

                iniciarEscucha();

                return;

            }


            console.log(
                "Emmet escuchó:",
                texto
            );


            await procesarTexto(
                texto
            );

        };


    reconocimiento.onerror =
        event => {

            console.log(
                "Reconocimiento:",
                event.error
            );


            if (
                event.error ===
                "not-allowed"
            ) {

                estado.textContent =
                    "Micrófono bloqueado";

                return;

            }


            if (
                event.error ===
                "service-not-allowed"
            ) {

                estado.textContent =
                    "Voz no permitida";

                return;

            }


            if (
                emmetActivo &&
                !hablando &&
                !pensando &&
                !modoNinja
            ) {

                setTimeout(
                    iniciarEscucha,
                    500
                );

            }

        };


    reconocimiento.onend =
        () => {

            if (
                emmetActivo &&
                !hablando &&
                !pensando &&
                !modoNinja
            ) {

                setTimeout(
                    iniciarEscucha,
                    300
                );

            }

        };

}


/* =====================================================
   INICIAR ESCUCHA
===================================================== */

function iniciarEscucha() {

    if (!emmetActivo)
        return;

    if (hablando)
        return;

    if (pensando)
        return;

    if (modoNinja)
        return;


    if (!reconocimiento) {

        estado.textContent =
            "Voz no compatible";

        return;

    }


    try {

        reconocimiento.start();

    } catch(e) {

        console.log(
            "Escucha ya iniciada."
        );

    }

}


/* =====================================================
   NORMALIZAR TEXTO
===================================================== */

function normalizar(texto) {

    return texto

        .toLowerCase()

        .normalize("NFD")

        .replace(
            /[\u0300-\u036f]/g,
            ""
        )

        .replace(
            /[.,!?¿¡]/g,
            ""
        )

        .trim();

}


/* =====================================================
   PROCESAR TEXTO
===================================================== */

async function procesarTexto(
    texto
) {

    const t =
        normalizar(texto);


    console.log(
        "Comando:",
        t
    );


    /* =================================================
       SALIR DEL MODO NINJA
    ================================================= */

    if (
        modoNinja &&
        (
            t.includes("modo ninja") ||
            t.includes("desactiva ninja") ||
            t.includes("desactivar ninja") ||
            t.includes("sal de ninja") ||
            t.includes("salir del modo ninja") ||
            t.includes("quita el modo ninja")
        )
    ) {

        modoNinja =
            false;


        emmet.className =
            "";


        estado.textContent =
            "Emmet";


        await hablar(
            "Modo ninja desactivado."
        );


        return;

    }


    /* =================================================
       ACTIVAR MODO NINJA
    ================================================= */

    if (
        !modoNinja &&
        (
            t.includes("modo ninja") ||
            t.includes("modo silencioso") ||
            t.includes("silencio emmet")
        )
    ) {

        modoNinja =
            true;


        if (reconocimiento) {

            try {

                reconocimiento.abort();

            } catch(e) {}

        }


        speechSynthesis.cancel();


        emmet.className =
            "ninja";


        estado.textContent =
            "Modo ninja";


        return;

    }


    /* =================================================
       IGNORAR TODO EN NINJA
    ================================================= */

    if (modoNinja) {

        return;

    }


    /* =================================================
       MAGDA
    ================================================= */

    if (
        t === "magda" ||
        t.includes("magda")
    ) {

        await hablar(
            "Hola mamá"
        );

        return;

    }


    /* =================================================
       GERARD / GERI
    ================================================= */

    if (
        t === "gerard" ||
        t === "geri" ||
        t.includes("gerard") ||
        t.includes("geri")
    ) {

        await hablar(
            "Ese es mi creador."
        );

        return;

    }


    /* =================================================
       EMMET SALUDA
    ================================================= */

    if (
        t.includes("emmet saluda")
    ) {

        await hablar(
            "Hola"
        );

        return;

    }


    /* =================================================
       MAPS
    ================================================= */

    if (
        t === "maps" ||
        t === "map" ||
        t === "mapa" ||
        t === "mapas" ||

        t.includes("abre maps") ||
        t.includes("abrir maps") ||

        t.includes("abre map") ||
        t.includes("abrir map") ||

        t.includes("abre mapa") ||
        t.includes("abrir mapa") ||

        t.includes("abre mapas") ||
        t.includes("abrir mapas") ||

        t.includes("ensename el mapa") ||
        t.includes("muestrame el mapa") ||

        t.includes("quiero ver el mapa") ||

        t.includes("abre el mapa") ||
        t.includes("abrir el mapa") ||

        t.includes("abre el maps") ||
        t.includes("abrir el maps")
    ) {

        abrirMaps();

        return;

    }


    /* =================================================
       CERRAR MAPS
    ================================================= */

    if (
        t.includes("cierra maps") ||
        t.includes("cerrar maps") ||

        t.includes("cierra map") ||
        t.includes("cerrar map") ||

        t.includes("cierra mapa") ||
        t.includes("cerrar mapa") ||

        t.includes("cierra el mapa") ||
        t.includes("cerrar el mapa")
    ) {

        cerrarMaps();

        return;

    }


    /* =================================================
       SALUDOS
    ================================================= */

    if (
        t === "hola" ||
        t === "hola emmet" ||
        t === "buenas"
    ) {

        await hablar(
            "Hola. Soy Emmet."
        );

        return;

    }


    /* =================================================
       NOMBRE
    ================================================= */

    if (
        t.includes("como te llamas") ||
        t.includes("quien eres")
    ) {

        await hablar(
            "Me llamo Emmet."
        );

        return;

    }


    /* =================================================
       GRACIAS
    ================================================= */

    if (
        t.includes("gracias")
    ) {

        await hablar(
            "De nada."
        );

        return;

    }


    /* =================================================
       ADIÓS
    ================================================= */

    if (
        t === "adios" ||
        t.includes("hasta luego")
    ) {

        await hablar(
            "Hasta luego."
        );

        return;

    }


    /* =================================================
       TODO LO DEMÁS → GROQ
       
       Aquí también puede responder preguntas
       de diccionario, definiciones, etc.
    ================================================= */

    await preguntarGroq(
        texto
    );

}


/* =====================================================
   GROQ
===================================================== */

async function preguntarGroq(
    pregunta
) {

    pensando =
        true;


    estadoPensando();


    if (reconocimiento) {

        try {

            reconocimiento.abort();

        } catch(e) {}

    }


    try {

        const respuesta =
            await fetch(
                "/api/groq",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            pregunta:
                                pregunta
                        })
                }
            );


        const datos =
            await respuesta.json();


        if (!respuesta.ok) {

            console.error(
                datos
            );


            pensando =
                false;


            await hablar(
                "Ha ocurrido un error con mi conexión."
            );


            return;

        }


        const respuestaTexto =
            datos.respuesta;


        pensando =
            false;


        await hablar(
            respuestaTexto
        );


    } catch(error) {

        console.error(
            error
        );


        pensando =
            false;


        await hablar(
            "No puedo conectar con mi cerebro ahora mismo."
        );

    }

}


/* =====================================================
   MAPS
===================================================== */

function abrirMaps() {

    console.log(
        "ABRIENDO MAPS"
    );


    document
        .getElementById("mapa")
        .style.display =
            "block";


    if (!mapa) {

        mapa =
            L.map("map")
                .setView(
                    [40.4168, -3.7038],
                    6
                );


        L.tileLayer(
            "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
            {
                attribution:
                    "&copy; OpenStreetMap contributors"
            }
        ).addTo(mapa);

    }


    setTimeout(
        () => {

            mapa.invalidateSize();

        },
        200
    );


    if (
        !navigator.geolocation
    ) {

        hablar(
            "Este navegador no permite obtener la ubicación."
        );

        return;

    }


    estado.textContent =
        "Buscando ubicación...";


    navigator.geolocation.getCurrentPosition(

        posicion => {

            const lat =
                posicion.coords.latitude;


            const lon =
                posicion.coords.longitude;


            mapa.setView(
                [lat, lon],
                16
            );


            L.marker(
                [lat, lon]
            )
            .addTo(mapa)
            .bindPopup(
                "Estás aquí"
            )
            .openPopup();


            estado.textContent =
                "Ubicación encontrada";

        },


        error => {

            console.error(
                "Ubicación:",
                error
            );


            estado.textContent =
                "Ubicación no disponible";


            hablar(
                "No puedo obtener tu ubicación. Comprueba el permiso de ubicación."
            );

        },


        {
            enableHighAccuracy:
                true,

            timeout:
                10000,

            maximumAge:
                0
        }

    );

}


/* =====================================================
   CERRAR MAPS
===================================================== */

function cerrarMaps() {

    document
        .getElementById("mapa")
        .style.display =
            "none";


    estadoNormal();

}


/* =====================================================
   DATOS ASTRONÓMICOS
===================================================== */

const datosAstronomia = [

    "Un dato curioso de la astronomía es que un día en Venus dura más que su año.",

    "Un dato curioso de la astronomía es que la luz del Sol tarda unos ocho minutos en llegar hasta nosotros.",

    "Un dato curioso de la astronomía es que Saturno tiene una densidad media menor que la del agua.",

    "Un dato curioso de la astronomía es que Marte tiene uno de los volcanes más grandes conocidos del Sistema Solar.",

    "Un dato curioso de la astronomía es que las estrellas de neutrones son extremadamente densas."

];


/* =====================================================
   TEMPORIZADOR DE 1 MINUTO
===================================================== */

function iniciarTemporizadorSilencio() {

    detenerTemporizadorSilencio();


    if (!emmetActivo)
        return;


    if (modoNinja)
        return;


    temporizadorSilencio =
        setTimeout(
            async () => {

                if (
                    emmetActivo &&
                    !hablando &&
                    !pensando &&
                    !modoNinja
                ) {

                    const dato =
                        datosAstronomia[
                            Math.floor(
                                Math.random() *
                                datosAstronomia.length
                            )
                        ];


                    await hablar(
                        dato
                    );

                }

            },

            /*
               60.000 ms = 1 MINUTO
            */

            60000

        );

}


function detenerTemporizadorSilencio() {

    if (
        temporizadorSilencio
    ) {

        clearTimeout(
            temporizadorSilencio
        );


        temporizadorSilencio =
            null;

    }

}


/* =====================================================
   ACTIVAR EMMET
===================================================== */

boton.addEventListener(
    "click",
    async () => {

        if (emmetActivo)
            return;


        emmetActivo =
            true;


        boton.style.display =
            "none";


        estado.textContent =
            "Activando...";


        try {

            const stream =
                await navigator
                    .mediaDevices
                    .getUserMedia({
                        audio: true
                    });


            stream
                .getTracks()
                .forEach(
                    track =>
                        track.stop()
                );


        } catch(error) {

            console.error(
                error
            );


            estado.textContent =
                "Micrófono bloqueado";


            await hablar(
                "Necesito permiso para usar el micrófono."
            );


            return;

        }


        await hablar(
            "Hola. Soy Emmet."
        );


        iniciarEscucha();


        iniciarTemporizadorSilencio();

    }
);


/* =====================================================
   INICIO
===================================================== */

estadoNormal();

</script>

</body>
</html>

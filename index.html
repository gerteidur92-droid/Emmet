<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Emmet AI</title>

<style>
body{
    margin:0;
    background:#05070b;
    color:white;
    font-family:Arial,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    text-align:center;
}
#app{width:min(800px,90%);}
h1{font-size:64px;letter-spacing:10px;}
#orb{
    width:180px;
    height:180px;
    margin:35px auto;
    border-radius:50%;
    background:radial-gradient(circle,#fff,#7dd3fc,#2563eb,#05070b 70%);
    box-shadow:0 0 40px #38bdf8,0 0 100px #2563eb;
}
.listening{
    animation:pulse 1s infinite;
}
@keyframes pulse{
    50%{transform:scale(1.12);}
}
#answer{
    min-height:70px;
    font-size:22px;
}
button{
    padding:14px 25px;
    margin:8px;
    border:0;
    border-radius:12px;
    font-size:18px;
    cursor:pointer;
}
#state{color:#9ca3af;}
</style>
</head>

<body>

<div id="app">

<h1>EMMET</h1>

<div id="state">Iniciando...</div>

<div id="orb"></div>

<div id="answer"></div>

<div id="language">
<button onclick="start('es-ES')">🇪🇸 Español</button>
<button onclick="start('ca-ES')">🟨 Català</button>
</div>

</div>

<script>

let lang=null;

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

let recognition;

const orb=document.getElementById("orb");
const state=document.getElementById("state");
const answer=document.getElementById("answer");
const language=document.getElementById("language");

function speak(text){

    speechSynthesis.cancel();

    const u=new SpeechSynthesisUtterance(text);

    u.lang=lang;

    /*
    Voz juvenil y energética.
    No intenta copiar exactamente la voz de
    ningún personaje o actor.
    */

    u.pitch=1.3;
    u.rate=1.08;
    u.volume=1;

    u.onend=()=>{
        setTimeout(listen,500);
    };

    speechSynthesis.speak(u);
}

function start(language){

    lang=language;

    localStorage.setItem("emmetLanguage",lang);

    document.getElementById("language").style.display="none";

    if(lang==="ca-ES"){
        speak("Hola! Soc Emmet. T'escolto.");
    }else{
        speak("Hola! Soy Emmet. Te escucho.");
    }

    createRecognition();
}

function createRecognition(){

    if(!SpeechRecognition){

        answer.textContent =
        "Este navegador no permite reconocimiento de voz.";

        return;
    }

    recognition=new SpeechRecognition();

    recognition.lang=lang;
    recognition.continuous=false;
    recognition.interimResults=false;

    recognition.onstart=()=>{

        orb.classList.add("listening");

        state.textContent =
        lang==="ca-ES"
        ?"🎙️ T'escolto..."
        :"🎙️ Te escucho...";
    };

    recognition.onresult=(event)=>{

        const text=
        event.results[0][0].transcript;

        answer.textContent="Tú: "+text;

        process(text);
    };

    recognition.onerror=()=>{

        orb.classList.remove("listening");

        setTimeout(listen,1500);
    };

    recognition.onend=()=>{

        orb.classList.remove("listening");
    };
}

function listen(){

    if(!recognition || speechSynthesis.speaking)
        return;

    try{
        recognition.start();
    }catch(e){}
}

function process(text){

    const t=text.toLowerCase();

    if(t.includes("hola") || t.includes("buenas")){

        const r=
        lang==="ca-ES"
        ?"Hola! Què tal?"
        :"¡Hola! ¿Qué tal?";

        answer.textContent=r;
        speak(r);
        return;
    }

    if(t.includes("cómo te llamas") ||
       t.includes("como te llamas") ||
       t.includes("qui ets") ||
       t.includes("com et dius")){

        const r=
        lang==="ca-ES"
        ?"Em dic Emmet."
        :"Me llamo Emmet.";

        answer.textContent=r;
        speak(r);
        return;
    }

    if(t.includes("qué hora") ||
       t.includes("quina hora")){

        const time=new Date().toLocaleTimeString(
            lang==="ca-ES" ? "ca-ES":"es-ES",
            {hour:"2-digit",minute:"2-digit"}
        );

        const r=
        lang==="ca-ES"
        ?"Ara són les "+time
        :"Ahora son las "+time;

        answer.textContent=r;
        speak(r);
        return;
    }

    /*
    AQUÍ irá el cerebro de IA real.
    No inventamos respuestas falsas.
    */

    const r=
    lang==="ca-ES"
    ?"Encara no tinc connectat el meu cervell d'IA."
    :"Todavía no tengo conectado mi cerebro de IA.";

    answer.textContent=r;

    speak(r);
}

const saved=localStorage.getItem("emmetLanguage");

if(saved){

    lang=saved;

    language.style.display="none";

    createRecognition();

    setTimeout(()=>{

        if(lang==="ca-ES")
            speak("Hola! Soc Emmet. T'escolto.");
        else
            speak("Hola! Soy Emmet. Te escucho.");

    },800);
}

</script>

</body>
</html>

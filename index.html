```html
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emmet</title>

  <style>
    body {
      margin: 0;
      background: #050505;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }

    #emmet {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background: #111;
      border: 4px solid #555;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 60px;
      margin-bottom: 25px;
      box-shadow: 0 0 30px #222;
    }

    #estado {
      margin-bottom: 20px;
      font-size: 18px;
    }

    button {
      padding: 14px 25px;
      border: 0;
      border-radius: 25px;
      background: white;
      color: black;
      font-size: 17px;
      cursor: pointer;
    }

    button:hover {
      transform: scale(1.05);
    }
  </style>
</head>

<body>

  <div id="emmet">●‿●</div>

  <div id="estado">Pulsa para hablar con Emmet</div>

  <button onclick="escuchar()">🎤 Hablar con Emmet</button>

  <script>
    const estado = document.getElementById("estado");
    const cara = document.getElementById("emmet");

    const Reconocimiento =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;

    let reconocimiento;

    if (Reconocimiento) {
      reconocimiento = new Reconocimiento();
      reconocimiento.lang = "es-ES";
      reconocimiento.continuous = false;
      reconocimiento.interimResults = false;

      reconocimiento.onstart = () => {
        estado.textContent = "🎤 Te estoy escuchando...";
        cara.textContent = "◉‿◉";
      };

      reconocimiento.onend = () => {
        cara.textContent = "●‿●";
      };

      reconocimiento.onerror = () => {
        estado.textContent = "No he podido escucharte.";
        cara.textContent = "×‿×";
      };

      reconocimiento.onresult = (evento) => {
        const texto =
          evento.results[0][0].transcript.toLowerCase().trim();

        procesar(texto);
      };

    } else {
      estado.textContent =
        "Tu navegador no permite reconocimiento de voz.";
    }


    function escuchar() {
      if (!reconocimiento) return;

      window.speechSynthesis.cancel();
      reconocimiento.start();
    }


    function hablar(texto) {
      estado.textContent = texto;

      const voz = new SpeechSynthesisUtterance(texto);
      voz.lang = "es-ES";
      voz.rate = 1;
      voz.pitch = 1.15;

      voz.onstart = () => {
        cara.textContent = "◉ᴗ◉";
      };

      voz.onend = () => {
        cara.textContent = "●‿●";
      };

      speechSynthesis.speak(voz);
    }


    function procesar(texto) {

      // GOOGLE
      if (
        texto.startsWith("busca ") ||
        texto.startsWith("buscar ") ||
        texto.startsWith("emmet busca ") ||
        texto.startsWith("emmet, busca ")
      ) {

        let busqueda = texto
          .replace(/^emmet,\s*busca\s*/i, "")
          .replace(/^emmet\s+busca\s*/i, "")
          .replace(/^busca\s*/i, "")
          .replace(/^buscar\s*/i, "")
          .trim();

        if (!busqueda) {
          hablar("¿Qué quieres que busque?");
          return;
        }

        hablar("Buscando " + busqueda);

        const google =
          "https://www.google.com/search?q=" +
          encodeURIComponent(busqueda);

        setTimeout(() => {
          window.open(google, "_blank");
        }, 700);

        return;
      }


      // RESPUESTAS BÁSICAS
      if (texto.includes("hola")) {
        hablar("Hola. Soy Emmet. ¿Qué hacemos?");
        return;
      }

      if (texto.includes("cómo te llamas")) {
        hablar("Me llamo Emmet.");
        return;
      }

      if (texto.includes("qué puedes hacer")) {
        hablar(
          "Puedo escucharte, hablar contigo y hacer búsquedas en Google."
        );
        return;
      }

      if (texto.includes("gracias")) {
        hablar("De nada.");
        return;
      }

      if (texto.includes("adiós") || texto.includes("adios")) {
        hablar("Hasta luego.");
        return;
      }


      // SI NO ENTIENDE
      hablar(
        "No tengo una respuesta para eso todavía. Puedes decirme, por ejemplo, busca Godzilla Singular Point."
      );
    }
  </script>

</body>
</html>
```

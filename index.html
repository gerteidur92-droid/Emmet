<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EMMET</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #05070b;
    color: white;
    font-family: Arial, sans-serif;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

#app {
    width: 100%;
    max-width: 800px;
    text-align: center;
    padding: 30px;
}

h1 {
    font-size: 70px;
    margin: 0;
    letter-spacing: 12px;
}

#status {
    margin-top: 10px;
    color: #9ca3af;
    font-size: 18px;
}

#orb {
    width: 190px;
    height: 190px;
    border-radius: 50%;
    margin: 45px auto 25px;
    background: radial-gradient(circle, #ffffff, #7dd3fc, #2563eb, #05070b 70%);
    box-shadow: 0 0 35px #38bdf8, 0 0 100px #2563eb;
    transition: 0.3s;
}

#orb.listening {
    animation: pulse 1s infinite;
    box-shadow: 0 0 60px #22c55e, 0 0 130px #16a34a;
}

#orb.thinking {
    animation: pulse 0.7s infinite;
}

@keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.12); }
    100% { transform: scale(1); }
}

#text {
    min-height: 90px;
    font-size: 22px;
    line-height: 1.5;
    margin-top: 20px;
}

button {
    background: #111827;
    color: white;
    border: 1px solid #374151;
    border-radius: 12px;
    padding: 13px 22px;
    margin: 6px;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background: #1f2937;
}

#language {
    margin-top: 20px;
}

.hidden {
    display: none;
}
</style>
</head>

<body>

<div id="app">

    <h1>EMMET</h1>

    <div id="status">
        Iniciando...
    </div>

    <div id="orb"></div>

    <div id="text">
        ...
    </div>

    <div id="language">
        <button onclick="chooseLanguage('es-ES')">
            🇪🇸 Español
        </button>

        <button onclick="chooseLanguage('ca-ES')">
            🟨 Català
        </button>
    </div>

    <div id="controls" class="hidden">
        <button onclick="startListening()">
            🎙️ Hablar
        </button>

        <button onclick="clearMemory()">
            🧠 Borrar memoria
        </button>
    </div>

</div>

<script>

const orb = document.getElementById("orb");
const statusText = document.getElementById("status");
const text = document.getElementById("text");
const languageDiv = document.getElementById("language");
const controls = document.getElementById("controls");

let language = localStorage.getItem("emmet_language");
let memory = JSON.parse(localStorage.getItem("emmet_memory") || "[]");

let recognition = null;
let listening = false;
let speaking = false;


/* =========================
   PERSONALIDAD DE EMMET
========================= */

const personality = {

    es: {
        hello:
        "Hola. Soy Emmet. Estoy listo para hablar contigo.",

        language:
        "¿Prefieres hablar en español o en catalán?",

        listening:
        "Te escucho.",

        thinking:
        "Estoy pensando...",

        noSupport:
        "Tu navegador no permite reconocimiento de voz.",

        memoryDeleted:
        "He borrado mi memoria.",

        unknown:
        "He entendido lo que dices, pero todavía necesito conectar un cerebro de inteligencia artificial para poder responder cualquier pregunta."
    },

    ca: {
        hello:
        "Hola. Soc l'Emmet. Estic preparat per parlar amb tu.",

        language:
        "Prefereixes parlar en català o en castellà?",

        listening:
        "T'escolto.",

        thinking:
        "Estic pensant...",

        noSupport:
        "El teu navegador no permet el reconeixement de veu.",

        memoryDeleted:
        "He esborrat la meva memòria.",

        unknown:
        "He entès el que dius, però encara necessito connectar un cervell d'intel·ligència artificial per poder respondre qualsevol pregunta."
    }

};


/* =========================
   ELEGIR IDIOMA
========================= */

function chooseLanguage(lang) {

    language = lang;

    localStorage.setItem(
        "emmet_language",
        language
    );

    languageDiv.classList.add("hidden");
    controls.classList.remove("hidden");

    if (language === "es-ES") {

        statusText.textContent =
            "EMMET • Español";

        speak(personality.es.hello, "es-ES");

    } else {

        statusText.textContent =
            "EMMET • Català";

        speak(personality.ca.hello, "ca-ES");
    }

    setTimeout(() => {

        startListening();

    }, 2500);
}


/* =========================
   SI YA HABÍA IDIOMA
========================= */

if (language) {

    languageDiv.classList.add("hidden");
    controls.classList.remove("hidden");

    statusText.textContent =
        language === "es-ES"
        ? "EMMET • Español"
        : "EMMET • Català";

    setTimeout(() => {

        if (language === "es-ES") {

            speak(
                "Hola. Soy Emmet. Te escucho.",
                "es-ES"
            );

        } else {

            speak(
                "Hola. Soc l'Emmet. T'escolto.",
                "ca-ES"
            );
        }

    }, 1000);

}


/* =========================
   VOZ
========================= */

function speak(message, lang) {

    if (!("speechSynthesis" in window)) {
        return;
    }

    speaking = true;

    speechSynthesis.cancel();

    const voice = new SpeechSynthesisUtterance(message);

    voice.lang = lang;

    /*
       Voz joven y energética.
       No copia ninguna voz concreta.
    */

    voice.rate = 1.08;
    voice.pitch = 1.25;
    voice.volume = 1;

    const voices = speechSynthesis.getVoices();

    let selectedVoice =
        voices.find(v =>
            v.lang.toLowerCase().startsWith(
                lang.substring(0,2).toLowerCase()
            )
        );

    if (selectedVoice) {
        voice.voice = selectedVoice;
    }

    voice.onstart = () => {

        speaking = true;

        orb.classList.remove("listening");
        orb.classList.add("thinking");

        statusText.textContent =
            language === "es-ES"
            ? "Emmet está hablando..."
            : "Emmet està parlant...";
    };

    voice.onend = () => {

        speaking = false;

        orb.classList.remove("thinking");

        setTimeout(() => {

            startListening();

        }, 500);
    };

    speechSynthesis.speak(voice);
}


/* =========================
   RECONOCIMIENTO
========================= */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

if (SpeechRecognition) {

    recognition = new SpeechRecognition();

    recognition.continuous = false;

    recognition.interimResults = false;

    recognition.maxAlternatives = 1;

    recognition.onstart = () => {

        listening = true;

        orb.classList.remove("thinking");
        orb.classList.add("listening");

        statusText.textContent =
            language === "es-ES"
            ? "🎙️ Te escucho..."
            : "🎙️ T'escolto...";
    };


    recognition.onresult = (event) => {

        const heard =
            event.results[0][0].transcript;

        text.textContent = "Tú: " + heard;

        saveMemory(heard);

        processCommand(heard);
    };


    recognition.onerror = (event) => {

        listening = false;

        orb.classList.remove("listening");

        statusText.textContent =
            "Micrófono: " + event.error;

        setTimeout(() => {

            startListening();

        }, 1500);
    };


    recognition.onend = () => {

        listening = false;

        orb.classList.remove("listening");
    };

}


/* =========================
   EMPEZAR A ESCUCHAR
========================= */

function startListening() {

    if (!recognition) {

        const msg =
            language === "es-ES"
            ? personality.es.noSupport
            : personality.ca.noSupport;

        text.textContent = msg;

        speak(msg, language);

        return;
    }

    if (speaking || listening) {
        return;
    }

    recognition.lang = language;

    try {

        recognition.start();

    } catch (error) {

        console.log(error);

    }
}


/* =========================
   MEMORIA
========================= */

function saveMemory(message) {

    memory.push({

        text: message,

        date: new Date().toISOString()

    });

    /*
       Guardamos solamente las últimas 100 frases.
    */

    if (memory.length > 100) {

        memory =
            memory.slice(-100);
    }

    localStorage.setItem(
        "emmet_memory",
        JSON.stringify(memory)
    );
}


function clearMemory() {

    memory = [];

    localStorage.removeItem(
        "emmet_memory"
    );

    const msg =
        language === "es-ES"
        ? personality.es.memoryDeleted
        : personality.ca.memoryDeleted;

    text.textContent = msg;

    speak(msg, language);
}


/* =========================
   COMANDOS BÁSICOS
========================= */

function processCommand(message) {

    const m = message.toLowerCase();

    if (
        m.includes("cómo te llamas") ||
        m.includes("como te llamas") ||
        m.includes("qui ets") ||
        m.includes("com et dius")
    ) {

        const answer =
            language === "es-ES"
            ? "Me llamo Emmet."
            : "Em dic Emmet.";

        text.textContent = answer;

        speak(answer, language);

        return;
    }


    if (
        m.includes("recuerdas") ||
        m.includes("qué recuerdas") ||
        m.includes("que recuerdas") ||
        m.includes("recordes")
    ) {

        let answer;

        if (memory.length === 0) {

            answer =
                language === "es-ES"
                ? "Todavía no recuerdo nada."
                : "Encara no recordo res.";

        } else {

            const last =
                memory
                .slice(-5)
                .map(x => x.text)
                .join(". ");

            answer =
                language === "es-ES"
                ? "Recuerdo estas cosas recientes: " + last
                : "Recordo aquestes coses recents: " + last;
        }

        text.textContent = answer;

        speak(answer, language);

        return;
    }


    if (
        m.includes("borra tu memoria") ||
        m.includes("olvida todo") ||
        m.includes("oblida-ho tot") ||
        m.includes("esborra la memoria")
    ) {

        clearMemory();

        return;
    }


    if (
        m.includes("hola") ||
        m.includes("buenas") ||
        m.includes("bon dia") ||
        m.includes("hola emmet")
    ) {

        const answer =
            language === "es-ES"
            ? "Hola. ¿En qué puedo ayudarte?"
            : "Hola. En què et puc ajudar?";

        text.textContent = answer;

        speak(answer, language);

        return;
    }


    /*
       RESPUESTA PROVISIONAL

       Aquí es donde posteriormente conectaremos
       el cerebro de IA.
    */

    const answer =
        language === "es-ES"
        ? personality.es.unknown
        : personality.ca.unknown;

    text.textContent = answer;

    speak(answer, language);
}


/* =========================
   VOCES DEL NAVEGADOR
========================= */

speechSynthesis.onvoiceschanged = () => {

    speechSynthesis.getVoices();

};


/* =========================
   PRIMERA PREGUNTA
========================= */

if (!language) {

    statusText.textContent =
        "Elige tu idioma";

    text.textContent =
        "¿Català o Español?";

}

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emmet</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        background: #050505;
        color: white;
        font-family: Arial, sans-serif;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 25px;
    }

    #emmet {
        width: 330px;
        height: 330px;
        border-radius: 50%;
        background: #000;
        border: 3px solid #151515;
        box-shadow: 0 0 35px rgba(0, 220, 255, 0.15);

        display: flex;
        justify-content: center;
        align-items: center;
        gap: 65px;

        transition: 0.3s;
    }

    .eye {
        width: 58px;
        height: 100px;
        border-radius: 50%;
        background: #00eaff;
        box-shadow: 0 0 25px #00eaff;
        transition: 0.2s;
    }

    .blink {
        height: 8px;
    }

    .thinking {
        box-shadow: 0 0 45px #9b00ff;
    }

    .thinking .eye {
        background: #9b00ff;
        box-shadow: 0 0 30px #9b00ff;
    }

    .silent {
        opacity: 0.35;
    }

    #status {
        font-size: 16px;
        color: #aaa;
        text-align: center;
        min-height: 22px;
    }

    button {
        border: none;
        border-radius: 30px;
        padding: 15px 25px;
        background: #00eaff;
        color: #000;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
    }

    button:hover {
        transform: scale(1.05);
    }
</style>
</head>

<body>

<div id="emmet">
    <div class="eye"></div>
    <div class="eye"></div>
</div>

<div id="status">Emmet está apagado</div>

<button id="activar">ACTIVAR EMMET</button>

<script>

const emmet = document.getElementById("emmet");
const statusText = document.getElementById("status");
const boton = document.getElementById("activar");

let activo = false;
let modoNinja = false;
let hablando = false;
let ultimoSonido = Date.now();


// ===============================
// DATOS DE ASTRONOMÍA
// ===============================

const datosAstronomia = [

    "un dato curioso de la astronomía es que un día en Venus dura más que un año en Venus.",

    "un dato curioso de la astronomía es que Júpiter es tan grande que cabrían más de mil Tierras dentro de él.",

    "un dato curioso de la astronomía es que la luz del Sol tarda unos ocho minutos en llegar hasta la Tierra.",

    "un dato curioso de la astronomía es que Saturno tiene una densidad media menor que la del agua.",

    "un dato curioso de la astronomía es que en Marte se encuentra Olympus Mons, uno de los volcanes más grandes conocidos del Sistema Solar.",

    "un dato curioso de la astronomía es que las estrellas que vemos en el cielo están a distancias muy diferentes de nosotros.",

    "un dato curioso de la astronomía es que una cucharadita de materia de una estrella de neutrones tendría una masa enorme debido a su extrema densidad.",

    "un dato curioso de la astronomía es que la Vía Láctea y Andrómeda se están acercando entre sí.",

    "un dato curioso de la astronomía es que algunas estrellas que vemos hoy ya podrían haber cambiado porque su luz tarda años en llegar hasta nosotros.",

    "un dato curioso de la astronomía es que los agujeros negros pueden tener millones o incluso miles de millones de veces la masa del Sol."

];


// ===============================
// VOZ
// ===============================

function hablar(texto) {

    if (modoNinja) return;

    hablando = true;

    emmet.classList.add("thinking");
    statusText.textContent = "Emmet está hablando...";

    speechSynthesis.cancel();

    const voz = new SpeechSynthesisUtterance(texto);

    voz.lang = "es-ES";
    voz.rate = 1.05;
    voz.pitch = 1.15;
    voz.volume = 1;

    voz.onend = () => {

        hablando = false;

        emmet.classList.remove("thinking");

        if (!modoNinja) {
            statusText.textContent = "Escuchando...";
        }
    };

    speechSynthesis.speak(voz);
}


// ===============================
// BLINK
// ===============================

setInterval(() => {

    if (!activo) return;

    const ojos = document.querySelectorAll(".eye");

    ojos.forEach(ojo => ojo.classList.add("blink"));

    setTimeout(() => {
        ojos.forEach(ojo => ojo.classList.remove("blink"));
    }, 150);

}, 3500);


// ===============================
// GEMINI YA NO SE USA
// ===============================


// ===============================
// GROQ
// ===============================

async function preguntarGroq(pregunta) {

    if (modoNinja) return;

    emmet.classList.add("thinking");

    statusText.textContent = "Emmet está pensando...";

    try {

        const respuesta = await fetch("/api/groq", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                pregunta: pregunta
            })

        });

        const datos = await respuesta.json();

        if (!respuesta.ok) {

            console.error(datos);

            hablar("Ha ocurrido un error al conectarme con mi inteligencia artificial.");

            return;
        }

        if (!datos.respuesta) {

            hablar("No he recibido ninguna respuesta.");

            return;
        }

        hablar(datos.respuesta);

    } catch (error) {

        console.error(error);

        hablar("No puedo conectarme con mi servidor ahora mismo.");

    }
}


// ===============================
// PROCESAR LO QUE DICE EL USUARIO
// ===============================

function procesarTexto(texto) {

    texto = texto.toLowerCase().trim();

    console.log("Usuario:", texto);


    // MODO NINJA

    if (
        texto.includes("modo ninja") ||
        texto.includes("modo silencioso") ||
        texto.includes("silencio emmet")
    ) {

        modoNinja = !modoNinja;

        speechSynthesis.cancel();

        if (modoNinja) {

            emmet.classList.add("silent");

            statusText.textContent = "🥷 Modo ninja";

        } else {

            emmet.classList.remove("silent");

            hablar("Modo ninja desactivado.");

        }

        return;
    }


    // Si está en modo ninja, no responde

    if (modoNinja) return;


    // RESPUESTAS RÁPIDAS

    if (
        texto === "hola" ||
        texto.includes("hola emmet") ||
        texto.includes("buenas")
    ) {

        hablar("¡Hola! Soy Emmet.");

        return;
    }


    if (
        texto.includes("cómo te llamas") ||
        texto.includes("como te llamas") ||
        texto.includes("tu nombre")
    ) {

        hablar("Me llamo Emmet.");

        return;
    }


    if (texto.includes("gracias")) {

        hablar("¡De nada!");

        return;
    }


    if (
        texto.includes("adiós") ||
        texto.includes("adios")
    ) {

        hablar("Hasta luego.");

        return;
    }


    // TODO LO DEMÁS → GROQ

    preguntarGroq(texto);
}


// ===============================
// RECONOCIMIENTO DE VOZ
// ===============================

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

let recognition = null;

if (SpeechRecognition) {

    recognition = new SpeechRecognition();

    recognition.lang = "es-ES";

    recognition.continuous = true;

    recognition.interimResults = false;


    recognition.onstart = () => {

        if (!modoNinja) {
            statusText.textContent = "Escuchando...";
        }

    };


    recognition.onresult = (event) => {

        const ultimo =
            event.results[event.results.length - 1];

        const texto =
            ultimo[0].transcript;

        ultimoSonido = Date.now();

        procesarTexto(texto);

    };


    recognition.onerror = (event) => {

        console.log("Error de reconocimiento:", event.error);

    };


    recognition.onend = () => {

        if (activo) {

            setTimeout(() => {

                try {
                    recognition.start();
                } catch (e) {}

            }, 300);

        }

    };

}


// ===============================
// DETECTOR DE SONIDO
// ===============================

let audioContext = null;
let analyser = null;
let microphone = null;


async function iniciarDetectorAudio() {

    try {

        const stream =
            await navigator.mediaDevices.getUserMedia({
                audio: true
            });

        audioContext =
            new AudioContext();

        analyser =
            audioContext.createAnalyser();

        microphone =
            audioContext.createMediaStreamSource(stream);

        microphone.connect(analyser);

        analyser.fftSize = 512;

        detectarSonido();

    } catch (error) {

        console.log(
            "No se pudo activar el detector de sonido:",
            error
        );

    }

}


function detectarSonido() {

    if (!activo) return;

    const datos =
        new Uint8Array(analyser.fftSize);

    analyser.getByteTimeDomainData(datos);

    let suma = 0;

    for (let i = 0; i < datos.length; i++) {

        const valor =
            (datos[i] - 128) / 128;

        suma += valor * valor;

    }

    const volumen =
        Math.sqrt(suma / datos.length);


    if (volumen > 0.025) {

        ultimoSonido = Date.now();

    }


    // 8 segundos sin ruido

    if (
        Date.now() - ultimoSonido > 8000 &&
        !hablando &&
        !modoNinja
    ) {

        ultimoSonido = Date.now();

        const dato =
            datosAstronomia[
                Math.floor(
                    Math.random() *
                    datosAstronomia.length
                )
            ];

        hablar(dato);

    }


    requestAnimationFrame(detectarSonido);

}


// ===============================
// ACTIVAR EMMET
// ===============================

boton.addEventListener("click", async () => {

    if (activo) return;

    activo = true;

    boton.style.display = "none";

    statusText.textContent =
        "Activando Emmet...";

    await iniciarDetectorAudio();


    if (recognition) {

        try {

            recognition.start();

        } catch (error) {

            console.log(error);

        }

    } else {

        statusText.textContent =
            "Este navegador no permite reconocimiento de voz.";

        return;
    }


    hablar(
        "Hola. Soy Emmet. Ya estoy conectado."
    );

});

</script>

</body>
</html>

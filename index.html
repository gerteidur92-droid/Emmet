<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emmet</title>

    <style>
        body {
            margin: 0;
            background: #080808;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }

        #emmet {
            width: 90%;
            max-width: 700px;
        }

        h1 {
            font-size: 60px;
            margin-bottom: 10px;
        }

        #status {
            font-size: 20px;
            opacity: 0.8;
            margin: 20px;
        }

        button {
            padding: 15px 25px;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            cursor: pointer;
            margin: 5px;
        }

        #mic {
            font-size: 30px;
            border-radius: 50%;
            width: 80px;
            height: 80px;
        }

        #memory {
            margin-top: 30px;
            font-size: 14px;
            opacity: 0.5;
        }
    </style>
</head>

<body>

<div id="emmet">

    <h1>EMMET</h1>

    <div id="status">Iniciant...</div>

    <button id="mic">🎙️</button>

    <div id="memory"></div>

</div>

<script>

    // =========================
    // EMMET
    // =========================

    let idioma = null;

    // -------------------------
    // MEMORIA
    // -------------------------

    let memoria = JSON.parse(
        localStorage.getItem("emmet_memoria") || "{}"
    );

    function guardarMemoria() {
        localStorage.setItem(
            "emmet_memoria",
            JSON.stringify(memoria)
        );
    }

    // -------------------------
    // VOZ
    // -------------------------

    function hablar(texto) {

        speechSynthesis.cancel();

        const voz = new SpeechSynthesisUtterance(texto);

        if (idioma === "ca") {
            voz.lang = "ca-ES";
        } else {
            voz.lang = "es-ES";
        }

        voz.rate = 1;
        voz.pitch = 1.25;

        speechSynthesis.speak(voz);
    }

    // -------------------------
    // RECONOCIMIENTO DE VOZ
    // -------------------------

    const Reconocimiento =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    let reconocimiento = null;

    if (Reconocimiento) {

        reconocimiento = new Reconocimiento();

        reconocimiento.continuous = false;
        reconocimiento.interimResults = false;

        reconocimiento.onstart = function() {

            document.getElementById("status").textContent =
                idioma === "ca"
                ? "T'escolto..."
                : "Te escucho...";
        };

        reconocimiento.onresult = function(event) {

            const texto =
                event.results[0][0].transcript;

            procesar(texto);
        };

        reconocimiento.onerror = function() {

            document.getElementById("status").textContent =
                idioma === "ca"
                ? "No t'he entès."
                : "No te he entendido.";
        };

        reconocimiento.onend = function() {

            document.getElementById("status").textContent =
                "Emmet";
        };
    }

    // -------------------------
    // ESCUCHAR
    // -------------------------

    function escuchar() {

        if (!reconocimiento) {

            alert(
                "El navegador no permite reconocimiento de voz."
            );

            return;
        }

        reconocimiento.lang =
            idioma === "ca"
            ? "ca-ES"
            : "es-ES";

        reconocimiento.start();
    }

    document.getElementById("mic")
        .addEventListener("click", escuchar);


    // -------------------------
    // PROCESAR LO QUE DICES
    // -------------------------

    function procesar(texto) {

        const t = texto.toLowerCase();

        // MEMORIA: nombre

        if (
            t.includes("me llamo") ||
            t.includes("em dic")
        ) {

            let nombre;

            if (t.includes("me llamo")) {
                nombre =
                    texto.split(/me llamo/i)[1].trim();
            } else {
                nombre =
                    texto.split(/em dic/i)[1].trim();
            }

            memoria.nombre = nombre;

            guardarMemoria();

            responder(
                idioma === "ca"
                ? "Encantat de conèixer-te, " + nombre
                : "Encantado de conocerte, " + nombre
            );

            return;
        }


        // PREGUNTAR NOMBRE

        if (
            t.includes("cómo me llamo") ||
            t.includes("com em dic")
        ) {

            if (memoria.nombre) {

                responder(
                    idioma === "ca"
                    ? "Et dius " + memoria.nombre
                    : "Te llamas " + memoria.nombre
                );

            } else {

                responder(
                    idioma === "ca"
                    ? "Encara no sé com et dius."
                    : "Todavía no sé cómo te llamas."
                );
            }

            return;
        }


        // SALUDOS

        if (
            t.includes("hola") ||
            t.includes("buenas") ||
            t.includes("bon dia") ||
            t.includes("hola emmet")
        ) {

            responder(
                idioma === "ca"
                ? "Hola! Sóc Emmet. En què et puc ajudar?"
                : "¡Hola! Soy Emmet. ¿En qué puedo ayudarte?"
            );

            return;
        }


        // QUIÉN ERES

        if (
            t.includes("quién eres") ||
            t.includes("qui ets")
        ) {

            responder(
                idioma === "ca"
                ? "Sóc Emmet, la teva intel·ligència artificial."
                : "Soy Emmet, tu inteligencia artificial."
            );

            return;
        }


        // HORA

        if (
            t.includes("qué hora") ||
            t.includes("quina hora")
        ) {

            const hora =
                new Date().toLocaleTimeString();

            responder(
                idioma === "ca"
                ? "Ara són les " + hora
                : "Ahora son las " + hora
            );

            return;
        }


        // DESCONOCIDO

        responder(
            idioma === "ca"
            ? "Encara estic aprenent. Aviat tindré un cervell d'intel·ligència artificial molt més potent."
            : "Todavía estoy aprendiendo. Pronto tendré un cerebro de inteligencia artificial mucho más potente."
        );
    }


    // -------------------------
    // RESPONDER
    // -------------------------

    function responder(texto) {

        document.getElementById("status")
            .textContent = texto;

        hablar(texto);
    }


    // -------------------------
    // ELEGIR IDIOMA
    // -------------------------

    function elegirIdioma() {

        idioma = prompt(
            "Català o Español?"
        );

        if (!idioma) {
            elegirIdioma();
            return;
        }

        idioma = idioma.toLowerCase();

        if (
            idioma.startsWith("c") ||
            idioma.includes("catal")
        ) {

            idioma = "ca";

            hablar(
                "Hola! Sóc Emmet. Comencem?"
            );

        } else {

            idioma = "es";

            hablar(
                "¡Hola! Soy Emmet. ¿Empezamos?"
            );
        }

        document.getElementById("status")
            .textContent =
            idioma === "ca"
            ? "Emmet està preparat"
            : "Emmet está preparado";
    }


    // -------------------------
    // INICIAR EMMET
    // -------------------------

    window.onload = function() {

        setTimeout(
            elegirIdioma,
            1000
        );

    };

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emmet</title>

<style>
body {
    margin: 0;
    background: #05070b;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

#app {
    margin-top: 100px;
}

#orb {
    width: 180px;
    height: 180px;
    margin: 40px auto;
    border-radius: 50%;
    background: radial-gradient(circle, white, #60a5fa, #1d4ed8);
    box-shadow: 0 0 60px #2563eb;
}

button {
    padding: 15px 25px;
    margin: 10px;
    border: 0;
    border-radius: 12px;
    font-size: 18px;
    cursor: pointer;
}

#respuesta {
    font-size: 22px;
    min-height: 60px;
}

#estado {
    color: #aaa;
}
</style>
</head>

<body>

<div id="app">

<h1>EMMET</h1>

<div id="estado">Elige un idioma</div>

<div id="orb"></div>

<div id="respuesta"></div>

<button onclick="iniciar('es-ES')">
🇪🇸 Español
</button>

<button onclick="iniciar('ca-ES')">
🟨 Català
</button>

</div>

<script>

let idioma = null;

function hablar(texto) {

    const voz = new SpeechSynthesisUtterance(texto);

    voz.lang = idioma;
    voz.pitch = 1.25;
    voz.rate = 1.08;

    speechSynthesis.cancel();
    speechSynthesis.speak(voz);
}

function iniciar(lang) {

    idioma = lang;

    if (lang === "ca-ES") {

        document.getElementById("estado").textContent =
            "Emmet està preparat.";

        document.getElementById("respuesta").textContent =
            "Hola! Soc Emmet.";

        hablar("Hola! Soc Emmet.");

    } else {

        document.getElementById("estado").textContent =
            "Emmet está preparado.";

        document.getElementById("respuesta").textContent =
            "¡Hola! Soy Emmet.";

        hablar("Hola! Soy Emmet.");
    }
}

</script>

</body>
</html>

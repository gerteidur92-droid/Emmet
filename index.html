<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emmet</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #050505;
    color: white;
    font-family: Arial, sans-serif;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 25px;
}

#emmet {
    width: 330px;
    height: 330px;

    border-radius: 50%;
    background: #000;
    border: 3px solid #151515;

    box-shadow: 0 0 35px rgba(0, 220, 255, 0.15);

    display: flex;
    justify-content: center;
    align-items: center;
    gap: 65px;

    transition: 0.3s;
}

.eye {
    width: 58px;
    height: 100px;

    border-radius: 50%;
    background: #00eaff;

    box-shadow: 0 0 25px #00eaff;

    transition: 0.2s;
}

.blink {
    height: 8px;
}

.thinking {
    box-shadow: 0 0 45px #9b00ff;
}

.thinking .eye {
    background: #9b00ff;
    box-shadow: 0 0 30px #9b00ff;
}

.listening .eye {
    box-shadow: 0 0 40px #00eaff;
}

.silent {
    opacity: 0.35;
}

#status {
    font-size: 16px;
    color: #aaa;
    text-align: center;
    min-height: 22px;
}

button {
    border: none;
    border-radius: 30px;

    padding: 15px 25px;

    background: #00eaff;
    color: #000;

    font-size: 16px;
    font-weight: bold;

    cursor: pointer;
}

button:hover {
    transform: scale(1.05);
}
</style>
</head>

<body>

<div id="emmet">

    <div class="eye"></div>
    <div class="eye"></div>

</div>

<div id="status">
    Emmet está apagado
</div>

<button id="activar">
    ACTIVAR EMMET
</button>


<script>

// =====================================================
// VARIABLES
// =====================================================

const emmet = document.getElementById("emmet");
const statusText = document.getElementById("status");
const boton = document.getElementById("activar");

let activo = false;
let modoNinja = false;

let hablando = false;
let pensando = false;

let reconocimientoActivo = false;

let ultimoSonido = 0;
let ultimoDatoAstronomia = 0;

const TIEMPO_SIN_SONIDO = 8000;


// =====================================================
// DATOS DE ASTRONOMÍA
// =====================================================

const datosAstronomia = [

    "Un dato curioso de la astronomía es que un día en Venus dura más que un año en Venus.",

    "Un dato curioso de la astronomía es que Júpiter es tan grande que cabrían más de mil Tierras dentro de él.",

    "Un dato curioso de la astronomía es que la luz del Sol tarda unos ocho minutos en llegar hasta la Tierra.",

    "Un dato curioso de la astronomía es que Saturno tiene una densidad media menor que la del agua.",

    "Un dato curioso de la astronomía es que Olympus Mons, en Marte, es uno de los volcanes más grandes conocidos del Sistema Solar.",

    "Un dato curioso de la astronomía es que la Vía Láctea y Andrómeda se están acercando entre sí.",

    "Un dato curioso de la astronomía es que algunas estrellas que vemos podrían haber cambiado hace mucho tiempo, pero todavía vemos su luz antigua.",

    "Un dato curioso de la astronomía es que las estrellas de neutrones son objetos extremadamente densos.",

    "Un dato curioso de la astronomía es que un agujero negro puede tener millones o incluso miles de millones de veces la masa del Sol.",

    "Un dato curioso de la astronomía es que Neptuno tarda aproximadamente 165 años terrestres en completar una vuelta alrededor del Sol."

];


// =====================================================
// HABLAR
// =====================================================

function hablar(texto) {

    if (modoNinja) {
        return;
    }

    hablando = true;

    // IMPORTANTE:
    // Mientras Emmet habla, el detector de sonido
    // no puede activar datos astronómicos.

    ultimoSonido = Date.now();

    emmet.classList.remove("listening");
    emmet.classList.add("thinking");

    statusText.textContent = "Emmet está hablando...";

    speechSynthesis.cancel();

    const voz = new SpeechSynthesisUtterance(texto);

    voz.lang = "es-ES";

    voz.rate = 1.05;

    voz.pitch = 1.15;

    voz.volume = 1;


    voz.onend = () => {

        hablando = false;

        pensando = false;

        emmet.classList.remove("thinking");

        if (!modoNinja) {

            statusText.textContent =
                "Escuchando...";

            // Reiniciamos el contador DESPUÉS
            // de que Emmet termine de hablar.

            ultimoSonido = Date.now();

        }

    };


    voz.onerror = () => {

        hablando = false;

        pensando = false;

        emmet.classList.remove("thinking");

        ultimoSonido = Date.now();

    };


    speechSynthesis.speak(voz);
}


// =====================================================
// PARPADEO
// =====================================================

setInterval(() => {

    if (!activo) {
        return;
    }

    const ojos =
        document.querySelectorAll(".eye");

    ojos.forEach(ojo => {

        ojo.classList.add("blink");

    });

    setTimeout(() => {

        ojos.forEach(ojo => {

            ojo.classList.remove("blink");

        });

    }, 150);

}, 3500);


// =====================================================
// GROQ
// =====================================================

async function preguntarGroq(pregunta) {

    if (modoNinja) {
        return;
    }

    pensando = true;

    emmet.classList.remove("listening");

    emmet.classList.add("thinking");

    statusText.textContent =
        "Emmet está pensando...";


    // Reiniciamos el contador para que
    // no hable de astronomía durante la respuesta.

    ultimoSonido = Date.now();


    try {

        const respuesta = await fetch(
            "/api/groq",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    pregunta: pregunta
                })
            }
        );


        const datos =
            await respuesta.json();


        if (!respuesta.ok) {

            console.error(datos);

            pensando = false;

            hablar(
                "Ha ocurrido un error al conectarme con mi inteligencia artificial."
            );

            return;
        }


        if (!datos.respuesta) {

            pensando = false;

            hablar(
                "No he recibido ninguna respuesta."
            );

            return;
        }


        pensando = false;

        hablar(datos.respuesta);


    } catch (error) {

        console.error(error);

        pensando = false;

        hablar(
            "No puedo conectarme con mi servidor ahora mismo."
        );

    }
}


// =====================================================
// PROCESAR VOZ
// =====================================================

function procesarTexto(texto) {

    texto =
        texto
        .toLowerCase()
        .trim();


    console.log(
        "Usuario:",
        texto
    );


    // -----------------------------------------------
    // MODO NINJA
    // -----------------------------------------------

    if (
        texto.includes("modo ninja") ||
        texto.includes("modo silencioso") ||
        texto.includes("silencio emmet")
    ) {

        if (!modoNinja) {

            modoNinja = true;

            speechSynthesis.cancel();

            hablando = false;
            pensando = false;

            emmet.classList.remove("thinking");

            emmet.classList.add("silent");

            statusText.textContent =
                "🥷 Modo ninja";

        } else {

            modoNinja = false;

            emmet.classList.remove("silent");

            ultimoSonido = Date.now();

            hablar(
                "Modo ninja desactivado."
            );

        }

        return;
    }


    // -----------------------------------------------
    // SI ESTÁ EN MODO NINJA
    // -----------------------------------------------

    if (modoNinja) {
        return;
    }


    // -----------------------------------------------
    // HOLA
    // -----------------------------------------------

    if (
        texto === "hola" ||
        texto.includes("hola emmet") ||
        texto.includes("buenas")
    ) {

        hablar(
            "¡Hola! Soy Emmet."
        );

        return;
    }


    // -----------------------------------------------
    // NOMBRE
    // -----------------------------------------------

    if (
        texto.includes("cómo te llamas") ||
        texto.includes("como te llamas") ||
        texto.includes("tu nombre")
    ) {

        hablar(
            "Me llamo Emmet."
        );

        return;
    }


    // -----------------------------------------------
    // GRACIAS
    // -----------------------------------------------

    if (
        texto.includes("gracias")
    ) {

        hablar(
            "¡De nada!"
        );

        return;
    }


    // -----------------------------------------------
    // ADIÓS
    // -----------------------------------------------

    if (
        texto.includes("adiós") ||
        texto.includes("adios")
    ) {

        hablar(
            "Hasta luego."
        );

        return;
    }


    // -----------------------------------------------
    // TODO LO DEMÁS → GROQ
    // -----------------------------------------------

    preguntarGroq(texto);
}


// =====================================================
// RECONOCIMIENTO DE VOZ
// =====================================================

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


let recognition = null;


if (SpeechRecognition) {

    recognition =
        new SpeechRecognition();


    recognition.lang =
        "es-ES";


    recognition.continuous =
        true;


    recognition.interimResults =
        false;


    recognition.onstart = () => {

        reconocimientoActivo = true;

        if (!modoNinja) {

            emmet.classList.add(
                "listening"
            );

            statusText.textContent =
                "Escuchando...";

        }

    };


    recognition.onresult = (event) => {

        const ultimoResultado =
            event.results[
                event.results.length - 1
            ];


        const texto =
            ultimoResultado[0]
            .transcript;


        // El usuario acaba de hablar.
        // Reiniciamos el contador de silencio.

        ultimoSonido =
            Date.now();


        if (!modoNinja) {

            emmet.classList.add(
                "listening"
            );

        }


        procesarTexto(texto);

    };


    recognition.onerror = (event) => {

        console.log(
            "Error de reconocimiento:",
            event.error
        );

    };


    recognition.onend = () => {

        reconocimientoActivo = false;


        if (
            activo &&
            recognition
        ) {

            setTimeout(() => {

                if (!activo) {
                    return;
                }

                try {

                    recognition.start();

                } catch (e) {}

            }, 500);

        }

    };

}


// =====================================================
// DETECTOR DE AUDIO
// =====================================================

let audioContext = null;

let analyser = null;

let microphone = null;

let datosAudio = null;


async function iniciarDetectorAudio() {

    try {

        const stream =
            await navigator.mediaDevices
            .getUserMedia({
                audio: true
            });


        audioContext =
            new AudioContext();


        analyser =
            audioContext.createAnalyser();


        microphone =
            audioContext
            .createMediaStreamSource(
                stream
            );


        microphone.connect(
            analyser
        );


        analyser.fftSize = 512;


        datosAudio =
            new Uint8Array(
                analyser.fftSize
            );


        // MUY IMPORTANTE:
        // El contador empieza AHORA.
        // Por tanto, no habrá dato instantáneo.

        ultimoSonido =
            Date.now();


        detectarSonido();


    } catch (error) {

        console.log(
            "No se pudo activar el micrófono:",
            error
        );

        statusText.textContent =
            "No se pudo activar el micrófono.";

    }

}


// =====================================================
// DETECTAR SONIDO
// =====================================================

function detectarSonido() {

    if (!activo) {
        return;
    }


    if (!analyser) {

        requestAnimationFrame(
            detectarSonido
        );

        return;
    }


    analyser.getByteTimeDomainData(
        datosAudio
    );


    let suma = 0;


    for (
        let i = 0;
        i < datosAudio.length;
        i++
    ) {

        const valor =
            (datosAudio[i] - 128) / 128;


        suma +=
            valor * valor;

    }


    const volumen =
        Math.sqrt(
            suma / datosAudio.length
        );


    // -----------------------------------------------
    // UMBRAL DE SONIDO
    // -----------------------------------------------

    // Un valor pequeño para evitar
    // que el ruido ambiente active Emmet.

    const HAY_SONIDO =
        volumen > 0.035;


    // -----------------------------------------------
    // SI HAY SONIDO
    // -----------------------------------------------

    if (
        HAY_SONIDO &&
        !hablando &&
        !pensando
    ) {

        ultimoSonido =
            Date.now();

    }


    // -----------------------------------------------
    // MODO NINJA
    // -----------------------------------------------

    if (modoNinja) {

        requestAnimationFrame(
            detectarSonido
        );

        return;
    }


    // -----------------------------------------------
    // EMMET HABLANDO
    // -----------------------------------------------

    if (hablando) {

        // El sonido de la propia voz
        // NO cuenta.

        ultimoSonido =
            Date.now();

        requestAnimationFrame(
            detectarSonido
        );

        return;
    }


    // -----------------------------------------------
    // EMMET PENSANDO
    // -----------------------------------------------

    if (pensando) {

        ultimoSonido =
            Date.now();

        requestAnimationFrame(
            detectarSonido
        );

        return;
    }


    // -----------------------------------------------
    // 8 SEGUNDOS REALES SIN SONIDO
    // -----------------------------------------------

    const tiempoSinSonido =
        Date.now() -
        ultimoSonido;


    if (
        tiempoSinSonido >=
        TIEMPO_SIN_SONIDO
    ) {


        // Evita que el dato se repita
        // inmediatamente.

        ultimoDatoAstronomia =
            Date.now();


        const numero =
            Math.floor(
                Math.random() *
                datosAstronomia.length
            );


        const dato =
            datosAstronomia[numero];


        // Reiniciamos el contador ANTES
        // de hablar.

        ultimoSonido =
            Date.now();


        hablar(dato);

    }


    requestAnimationFrame(
        detectarSonido
    );

}


// =====================================================
// ACTIVAR EMMET
// =====================================================

boton.addEventListener(
    "click",
    async () => {

        if (activo) {
            return;
        }


        activo = true;


        boton.style.display =
            "none";


        statusText.textContent =
            "Activando Emmet...";


        // Primero activamos el micrófono.

        await iniciarDetectorAudio();


        // Después activamos reconocimiento.

        if (recognition) {

            try {

                recognition.start();

            } catch (error) {

                console.log(error);

            }

        } else {

            statusText.textContent =
                "Este navegador no permite reconocimiento de voz.";

            return;

        }


        // IMPORTANTE:
        // Emmet habla primero.
        // Después de terminar comienza
        // el contador de 8 segundos.

        hablar(
            "Hola. Soy Emmet. Ya estoy conectado."
        );

    }
);

</script>

</body>
</html>
